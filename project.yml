name: ClaudeAccessManagement
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  ClaudeAccessManagement:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Claude Access Manager
        CFBundleDisplayName: Claude Access Manager
        LSMinimumSystemVersion: "12.0"
        LSUIElement: false
        NSHumanReadableCopyright: "© 2026"
    entitlements:
      path: Resources/App.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
